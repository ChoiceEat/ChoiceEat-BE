spring:
  application:
    name: choice-eat-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret-key: "${JWT_SECRET_KEY:choice-eat-local-jwt-secret-key-change-this-please-1234}"
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
